name: Release vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-vercel-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Git (autor reconhecido pela Vercel)
        env:
          SYNC_COMMIT_NAME: ${{ secrets.SYNC_COMMIT_NAME }}
          SYNC_COMMIT_EMAIL: ${{ secrets.SYNC_COMMIT_EMAIL }}
        run: |
          if [ -z "$SYNC_COMMIT_NAME" ] || [ -z "$SYNC_COMMIT_EMAIL" ]; then
            echo "Defina os secrets SYNC_COMMIT_NAME e SYNC_COMMIT_EMAIL no fork (conta GitHub do projeto na Vercel)."
            exit 1
          fi
          git config user.name "$SYNC_COMMIT_NAME"
          git config user.email "$SYNC_COMMIT_EMAIL"

      - name: Espelhar main → vercel
        env:
          SYNC_COMMIT_TOKEN: ${{ secrets.SYNC_COMMIT_TOKEN }}
        run: |
          main_sha=$(git rev-parse HEAD)
          git fetch origin vercel 2>/dev/null || true

          if git rev-parse --verify origin/vercel >/dev/null 2>&1; then
            vercel_sha=$(git rev-parse origin/vercel)
            if [ "$main_sha" = "$vercel_sha" ]; then
              echo "Branch vercel já aponta para ${main_sha:0:7}. Nada a publicar."
              exit 0
            fi
            echo "Atualizando vercel (${vercel_sha:0:7} → ${main_sha:0:7})."
          else
            echo "Branch vercel inexistente — criando a partir de main (${main_sha:0:7})."
          fi

          if [ -n "$SYNC_COMMIT_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_COMMIT_TOKEN}@github.com/${{ github.repository }}.git"
          fi

          git push --force-with-lease origin "HEAD:vercel"